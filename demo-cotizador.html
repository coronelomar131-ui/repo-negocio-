:root {
  --grafito: #1B1D1F;
  --grafito-2: #2A2D30;
  --hueso: #F3F0EA;
  --papel: #FFFFFF;
  --linea: #DDD8CE;
  --texto: #1B1D1F;
  --texto-2: #5B5E62;
  --aceite: #C2410C;
  --aceite-osc: #9A3412;
  --ambar: #F5B942;
  --verde: #0B7A3E;
  --verde-osc: #086131;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --cap: 0px;
}
* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: "DM Sans", ui-sans-serif, sans-serif;
  font-size: 16px; line-height: 1.4;
  color: var(--texto); background: var(--hueso);
  padding-top: var(--cap);
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Encabezado */
header { background: var(--grafito); color: var(--hueso); padding: 16px 16px 20px; }
.fila { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.marca { font-size: 14px; letter-spacing: .04em; text-transform: uppercase; color: #B9B5AB; }
.aviso { font-size: 12px; font-weight: 700; color: var(--grafito); background: var(--ambar); padding: 4px 8px; border-radius: 4px; white-space: nowrap; }
h1 { font-size: 28px; line-height: 1.1; font-weight: 700; margin-top: 8px; letter-spacing: -.01em; }

/* Búsqueda */
.buscar { padding: 16px; background: var(--grafito); padding-top: 0; }
.buscar label { display: block; font-size: 14px; color: #B9B5AB; margin-bottom: 8px; }
.campo { position: relative; }
.campo input {
  width: 100%; height: 56px; padding: 0 48px 0 16px; border-radius: 8px;
  border: 2px solid transparent; background: var(--papel); font-size: 18px; font-weight: 600;
}
.campo input::placeholder { color: #8A8D91; font-weight: 400; }
.campo input:focus-visible { outline: 3px solid var(--ambar); outline-offset: 2px; }
.borrar {
  position: absolute; right: 4px; top: 6px; width: 44px; height: 44px; border: 0; border-radius: 6px;
  background: transparent; font-size: 22px; color: var(--texto-2); display: none;
}
.borrar.on { display: block; }

/* Lista */
main { padding: 8px 0 128px; }
.cuenta { padding: 12px 16px 8px; font-size: 14px; color: var(--texto-2); }
ul { list-style: none; padding: 0; margin: 0; }
.pieza {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
  padding: 16px; background: var(--papel); border-bottom: 1px solid var(--linea);
}
.pieza.anim { animation: entra 280ms var(--ease-out) both; }
.pieza:first-child { border-top: 1px solid var(--linea); }
.nombre { font-weight: 700; font-size: 18px; line-height: 1.2; }
.detalle { font-size: 14px; color: var(--texto-2); grid-column: 1; }
.precio { font-size: 22px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.existe { font-size: 14px; font-weight: 600; color: var(--verde); }
.existe.poca { color: var(--aceite-osc); }
.meta { grid-column: 1; display: flex; align-items: center; gap: 8px; }
.agregar {
  grid-column: 2; grid-row: 2 / span 2; min-width: 112px; height: 48px; padding: 0 16px;
  border: 0; border-radius: 8px; background: var(--aceite); color: #fff; font-weight: 700; font-size: 16px;
  transition: transform 140ms var(--ease-out), background-color 140ms var(--ease-out);
}
.agregar:active { transform: scale(0.97); }
.agregar:disabled { background: #8A8D91; cursor: not-allowed; }
.agregar .n { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px; background: rgba(255,255,255,.22); font-variant-numeric: tabular-nums; }
.vacio { padding: 32px 16px; color: var(--texto-2); text-align: center; }
@media (hover: hover) and (pointer: fine) { .agregar:hover:not(:disabled) { background: var(--aceite-osc); } }
@keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* Barra inferior */
.barra {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--grafito); color: var(--hueso);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  transform: translateY(0); transition: transform 240ms var(--ease-out);
}
.barra[hidden] { display: flex; transform: translateY(110%); visibility: hidden; transition: transform 240ms var(--ease-out), visibility 0s linear 240ms; }
.resumen small { display: block; font-size: 14px; color: #B9B5AB; }
.resumen strong { font-size: 24px; font-variant-numeric: tabular-nums; }
.ver {
  height: 52px; padding: 0 20px; border: 0; border-radius: 8px; background: var(--ambar); color: var(--grafito);
  font-weight: 700; font-size: 16px; transition: transform 140ms var(--ease-out);
}
.ver:active { transform: scale(0.97); }

/* Hoja de cotización */
.fondo { position: fixed; inset: 0; z-index: 10; background: rgba(27,29,31,.55); opacity: 0; visibility: hidden; transition: opacity 200ms var(--ease-out), visibility 0s linear 200ms; }
.fondo.on { opacity: 1; visibility: visible; transition: opacity 200ms var(--ease-out); }
.hoja {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-height: calc(100dvh - var(--cap) - 24px); overflow: auto;
  background: var(--hueso); border-radius: 16px 16px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
  transform: translateY(100%); visibility: hidden; transform-origin: bottom center;
  transition: transform 280ms var(--ease-out), visibility 0s linear 280ms;
}
.hoja.on { transform: translateY(0); visibility: visible; transition: transform 280ms var(--ease-out); }
.hoja h2 { font-size: 22px; line-height: 1.2; }
.folio { font-size: 14px; color: var(--texto-2); margin-top: 4px; }
.renglon { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--linea); align-items: center; }
.renglon .t { font-weight: 600; }
.renglon .s { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.cant { display: flex; align-items: center; gap: 4px; }
.cant button { width: 44px; height: 44px; border: 1px solid var(--linea); border-radius: 8px; background: var(--papel); font-size: 20px; font-weight: 700; transition: transform 140ms var(--ease-out); }
.cant button:active { transform: scale(0.97); }
.cant output { min-width: 28px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.total { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0 4px; font-size: 18px; }
.total strong { font-size: 32px; font-variant-numeric: tabular-nums; }
.etq { font-size: 14px; color: var(--texto-2); margin: 16px 0 8px; }
.burbuja {
  white-space: pre-wrap; background: #DCF8C6; color: #1B1D1F; border-radius: 12px 12px 4px 12px; padding: 12px 14px;
  font-size: 15px; line-height: 1.35; max-width: 92%; margin-left: auto; box-shadow: 0 1px 1px rgba(0,0,0,.12);
}
.acciones { display: grid; gap: 8px; margin-top: 16px; }
.wa {
  height: 56px; border: 0; border-radius: 8px; background: var(--verde); color: #fff; font-size: 18px; font-weight: 700;
  transition: transform 140ms var(--ease-out), background-color 140ms var(--ease-out);
}
.wa:active { transform: scale(0.97); }
.sec { height: 48px; border: 1px solid var(--linea); border-radius: 8px; background: var(--papel); font-weight: 600; }
.sec:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) { .wa:hover { background: var(--verde-osc); } }
.aviso-pie { font-size: 13px; color: var(--texto-2); text-align: center; margin-top: 12px; }

/* Aviso emergente */
.toast {
  position: fixed; left: 16px; right: 16px; bottom: 24px; z-index: 20; background: var(--grafito); color: var(--hueso);
  padding: 14px 16px; border-radius: 8px; font-weight: 600; text-align: center;
  opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out);
}
.toast.on { opacity: 1; transform: translateY(0); }

:focus-visible { outline: 3px solid var(--aceite); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .pieza.anim { animation: none; }
  .barra, .hoja, .hoja.on, .toast { transform: none; }
  .barra[hidden] { transform: none; }
}
@media (min-width: 640px) {
  body { max-width: 480px; margin: 0 auto; box-shadow: 0 0 0 1px var(--linea); }
  .barra, .hoja { left: 50%; right: auto; width: 480px; margin-left: -240px; }
  .hoja { transform: translateY(100%); }
  .hoja.on { transform: translateY(0); }
}
</style>
</head>
<body>
<header>
  <div class="fila">
    <span class="marca">Refaccionaria Ejemplo</span>
    <span class="aviso">DATOS DE EJEMPLO</span>
  </div>
  <h1>Mostrador</h1>
</header>

<section class="buscar" aria-label="Buscar pieza">
  <label for="q">¿Qué pieza busca el cliente?</label>
  <div class="campo">
    <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="balata, filtro, bujía…">
    <button class="borrar" id="borrar" type="button" aria-label="Borrar búsqueda">×</button>
  </div>
</section>

<main>
  <p class="cuenta" id="cuenta" aria-live="polite"></p>
  <ul id="lista"></ul>
</main>

<div class="barra" id="barra" hidden>
  <div class="resumen"><small id="barra-n">0 piezas</small><strong id="barra-t">$0</strong></div>
  <button class="ver" id="ver" type="button">Ver cotización</button>
</div>

<div class="fondo" id="fondo"></div>
<section class="hoja" id="hoja" role="dialog" aria-modal="true" aria-labelledby="hoja-t" aria-hidden="true">
  <div class="fila">
    <div>
      <h2 id="hoja-t">Cotización</h2>
      <p class="folio" id="folio"></p>
    </div>
    <button class="sec" id="cerrar" type="button" style="width:44px;height:44px;padding:0" aria-label="Cerrar cotización">×</button>
  </div>
  <div id="renglones"></div>
  <div class="total"><span>Total</span><strong id="total">$0</strong></div>
  <p class="etq">Así le llega al cliente:</p>
  <div class="burbuja" id="burbuja"></div>
  <div class="acciones">
    <button class="wa" id="wa" type="button">Enviar por WhatsApp</button>
    <button class="sec" id="copiar" type="button">Copiar texto</button>
  </div>
  <p class="aviso-pie">Demo con datos de ejemplo. Los precios y la existencia no son reales.</p>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* Catálogo de ejemplo. Nombres y precios inventados para la demo. */
const CATALOGO = [
  { id: 1,  nombre: "Balatas delanteras cerámicas", detalle: "Tsuru, Sentra · juego",       precio: 389,  existencia: 12 },
  { id: 2,  nombre: "Balatas traseras",             detalle: "Tsuru · juego",               precio: 265,  existencia: 8  },
  { id: 3,  nombre: "Disco de freno ventilado",     detalle: "Jetta A4 · pieza",            precio: 620,  existencia: 4  },
  { id: 4,  nombre: "Filtro de aceite",             detalle: "Universal chico",             precio: 85,   existencia: 30 },
  { id: 5,  nombre: "Filtro de aire",               detalle: "Aveo · pieza",                precio: 142,  existencia: 15 },
  { id: 6,  nombre: "Bujías (juego de 4)",          detalle: "Iridio · compatibles 1.6 L",  precio: 276,  existencia: 9  },
  { id: 7,  nombre: "Banda de accesorios",          detalle: "Chevy · pieza",               precio: 198,  existencia: 6  },
  { id: 8,  nombre: "Amortiguador delantero",       detalle: "Tsuru · pieza",               precio: 540,  existencia: 5  },
  { id: 9,  nombre: "Batería 12 V 45 placas",       detalle: "Con 12 meses de garantía",    precio: 1480, existencia: 3  },
  { id: 10, nombre: "Aceite 20W-50",                detalle: "1 litro · mineral",           precio: 98,   existencia: 40 }
];

const peso = new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN", maximumFractionDigits: 0 });
const $ = (id) => document.getElementById(id);
const quitar = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const carrito = new Map(); // id -> cantidad
let foco = null;

function filtrar(texto) {
  const claves = quitar(texto).split(/\s+/).filter(Boolean);
  if (!claves.length) return CATALOGO;
  return CATALOGO.filter((p) => {
    const pajar = quitar(p.nombre + " " + p.detalle);
    return claves.every((c) => pajar.includes(c));
  });
}

function dibujarLista(animar) {
  const q = $("q").value;
  const hallados = filtrar(q);
  $("borrar").classList.toggle("on", q.length > 0);
  $("cuenta").textContent = q
    ? hallados.length + (hallados.length === 1 ? " pieza encontrada" : " piezas encontradas")
    : "Catálogo completo · " + CATALOGO.length + " piezas";
  const ul = $("lista");
  ul.innerHTML = "";
  if (!hallados.length) {
    const li = document.createElement("li");
    li.className = "vacio";
    li.textContent = "No hay piezas con ese nombre. Prueba con otra palabra.";
    ul.appendChild(li);
    return;
  }
  hallados.forEach((p, i) => {
    const enCarro = carrito.get(p.id) || 0;
    const restante = p.existencia - enCarro;
    const li = document.createElement("li");
    li.className = "pieza" + (animar ? " anim" : "");
    if (animar) li.style.animationDelay = Math.min(i, 5) * 40 + "ms";
    li.innerHTML =
      '<span class="nombre"></span><span class="precio"></span>' +
      '<span class="meta"><span class="existe"></span></span>' +
      '<span class="detalle"></span>' +
      '<button class="agregar" type="button"></button>';
    li.querySelector(".nombre").textContent = p.nombre;
    li.querySelector(".precio").textContent = peso.format(p.precio);
    li.querySelector(".detalle").textContent = p.detalle;
    const ex = li.querySelector(".existe");
    ex.textContent = restante > 0 ? (restante <= 5 ? "Quedan " + restante : "Hay " + restante) : "Sin existencia";
    if (restante <= 5) ex.classList.add("poca");
    const b = li.querySelector(".agregar");
    b.setAttribute("aria-label", "Agregar " + p.nombre + " a la cotización");
    b.dataset.id = p.id;
    b.disabled = restante <= 0;
    b.innerHTML = restante <= 0 ? "Agotada" : "Agregar" + (enCarro ? '<span class="n">×' + enCarro + "</span>" : "");
    b.addEventListener("click", () => cambiar(p.id, 1));
    ul.appendChild(li);
  });
}

function totales() {
  let n = 0, t = 0;
  carrito.forEach((c, id) => { n += c; t += c * CATALOGO.find((p) => p.id === id).precio; });
  return { n, t };
}

function dibujarBarra() {
  const { n, t } = totales();
  $("barra").hidden = n === 0;
  $("barra-n").textContent = n + (n === 1 ? " pieza" : " piezas");
  $("barra-t").textContent = peso.format(t);
}

function cambiar(id, delta) {
  const p = CATALOGO.find((x) => x.id === id);
  const nueva = Math.max(0, Math.min(p.existencia, (carrito.get(id) || 0) + delta));
  if (nueva === 0) carrito.delete(id); else carrito.set(id, nueva);
  dibujarBarra();
  if ($("hoja").classList.contains("on")) dibujarHoja(); else dibujarLista();
}

function textoWhatsApp() {
  const { t } = totales();
  const lineas = [];
  carrito.forEach((c, id) => {
    const p = CATALOGO.find((x) => x.id === id);
    lineas.push("• " + c + " × " + p.nombre + " — " + peso.format(c * p.precio));
  });
  return "Cotización · Refaccionaria Ejemplo\n\n" + lineas.join("\n") + "\n\nTotal: " + peso.format(t) +
         "\nPrecios vigentes 3 días. ¿Te las apartamos?";
}

function dibujarHoja() {
  const { t } = totales();
  const cont = $("renglones");
  cont.innerHTML = "";
  carrito.forEach((c, id) => {
    const p = CATALOGO.find((x) => x.id === id);
    const r = document.createElement("div");
    r.className = "renglon";
    r.innerHTML = '<span class="t"></span><span class="s"></span>' +
      '<div class="cant"><button type="button" aria-label="Quitar una"></button><output></output><button type="button" aria-label="Agregar una"></button></div>';
    r.querySelector(".t").textContent = p.nombre;
    r.querySelector(".s").textContent = peso.format(c * p.precio);
    const [menos, mas] = r.querySelectorAll("button");
    menos.textContent = "−"; mas.textContent = "+";
    menos.setAttribute("aria-label", "Quitar una " + p.nombre);
    mas.setAttribute("aria-label", "Agregar una " + p.nombre);
    r.querySelector("output").textContent = c;
    menos.addEventListener("click", () => cambiar(id, -1));
    mas.addEventListener("click", () => cambiar(id, 1));
    cont.appendChild(r);
  });
  $("total").textContent = peso.format(t);
  $("burbuja").textContent = textoWhatsApp();
  if (!carrito.size) cerrar();
}

function abrir() {
  foco = document.activeElement;
  const hoy = new Date();
  $("folio").textContent = "Folio de ejemplo · " + hoy.toLocaleDateString("es-MX", { day: "numeric", month: "short", year: "numeric" });
  dibujarHoja();
  $("fondo").classList.add("on");
  const h = $("hoja");
  h.classList.add("on"); h.setAttribute("aria-hidden", "false");
  $("cerrar").focus({ preventScroll: true });
}
function cerrar() {
  $("fondo").classList.remove("on");
  const h = $("hoja");
  h.classList.remove("on"); h.setAttribute("aria-hidden", "true");
  dibujarLista();
  if (foco && foco.focus) foco.focus({ preventScroll: true });
}

let tt;
function aviso(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2600);
}

$("q").addEventListener("input", () => dibujarLista(true));
$("borrar").addEventListener("click", () => { $("q").value = ""; dibujarLista(true); $("q").focus(); });
$("ver").addEventListener("click", abrir);
$("cerrar").addEventListener("click", cerrar);
$("fondo").addEventListener("click", cerrar);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("hoja").classList.contains("on")) cerrar(); });
$("wa").addEventListener("click", () => {
  const url = "https://wa.me/?text=" + encodeURIComponent(textoWhatsApp());
  window.open(url, "_blank", "noopener");
  aviso("Se abre WhatsApp con esta cotización lista");
});
$("copiar").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(textoWhatsApp()); aviso("Texto copiado"); }
  catch { aviso("No se pudo copiar. Mantén presionado el mensaje."); }
});

dibujarLista(true);
dibujarBarra();
</script>
</body>
</html>
